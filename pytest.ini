[pytest]
# pytest-homeassistant-custom-component's `hass` fixture (and others) are
# async fixtures; pytest-asyncio's default "strict" mode requires every
# async test to be explicitly marked, which the library's own docs note may
# not be enough on its own - auto mode treats every async def test_*
# function as a test to run, without needing @pytest.mark.asyncio on each.
asyncio_mode = auto
