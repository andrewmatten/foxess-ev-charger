# FoxESS EV Charger - Solar Surplus Charging
#
# Grid-limit / surplus-based charging control. Adjusts the charger's own
# Max Charging Current number entity up or down to keep grid import near a
# configurable ceiling, instead of charging at a fixed rate regardless of
# how much solar is actually available.
#
# Design:
#   - Triggers on every change of the grid power sensor, plus a once-a-
#     minute time_pattern safety net (so a sensor that stops updating
#     doesn't silently freeze the last setpoint forever - it'll still hit
#     the fail-safe branch below on the next minute tick if it went
#     unavailable, rather than only reacting to state changes that may
#     never come).
#   - Grid power is converted to Watts using the sensor's unit_of_measurement
#     (W or kW). Unsupported/missing units fail safe. Sign convention is then
#     positive = importing and negative = exporting surplus; flip "Invert
#     grid power sign" if yours is the other way around.
#   - Hysteresis: only acts once import is more than `hysteresis_watts`
#     above or below the ceiling, so it doesn't hunt/oscillate on every
#     small fluctuation around the ceiling itself.
#   - Minimum dwell time between adjustments, measured from the selected
#     Max Charging Current entity's `last_changed` timestamp (and, while
#     charging is on, the Charging switch's `last_changed`) rather than the
#     automation's `last_triggered`. The automation also runs once per minute
#     as a safety net, so `last_triggered` would continually reset the dwell
#     timer and eventually wedge all normal adjustments.
#   - Output is clamped to the Max Charging Current entity's own reported
#     `min`/`max` attributes at runtime, not hardcoded 6/32 A - this keeps
#     the blueprint correct on three-phase hardware (11kW/16A, 22kW/32A)
#     where those bounds differ from the single-phase 6-32A default,
#     falling back to 6/32 only if the entity doesn't report them.
#   - When import exceeds the ceiling + hysteresis while charging above
#     `min`, current is clamped down to `min` first; charging is stopped
#     only once already at (or below) `min`, or immediately if the switch
#     is already off with a staged `intent_enabled`.
#   - Fail-safe: if the grid sensor has no numeric value or reports an
#     unsupported unit, charging (and any staged `intent_enabled`) is
#     stopped rather than left running or armed with no trustworthy grid
#     reading. This bypasses the minimum-adjustment-delay dwell timer.
#   - When starting from off, Max Charging Current is reset to `entity_min`
#     before `switch.turn_on`, and `switch.turn_on` is only called when a
#     car is connected (not idle/finished/faulted/locked), `intent_enabled`
#     is not already true, and no latch or `needs_human` holds the charger.
#
# Known limitation, not solved here: this automation can only react to what
# the grid power sensor *reports*. A sensor that goes truly unavailable is
# caught by the fail-safe above, but a sensor that's merely stuck/frozen at
# a stale numeric value - still technically "available", just not updating -
# looks identical to a real, unchanging surplus and this blueprint has no
# way to tell the difference without explicit freshness metadata.
#
# Deliberately NOT included, on purpose: tariffs, time-of-use pricing, or
# any cost logic whatsoever. This is a grid-limit/surplus controller only -
# pair it with a separate tariff-aware automation if cost-based behaviour
# is also wanted.
blueprint:
  name: FoxESS EV Charger - Solar Surplus Charging
  description: >
    Keeps grid import near a target ceiling by raising/lowering the FoxESS
    EV Charger's Max Charging Current, with hysteresis and a minimum time
    between actual current changes. Starts from the charger's minimum
    current when turning on from off, requires a connected vehicle, clamps
    down to minimum current before stopping, and disarms any staged enable
    when stopping or failing safe. Grid power sensors must report W or kW;
    kW readings are converted to W. Grid-limit/surplus control only - no
    tariff or cost logic.
  domain: automation
  source_url: https://github.com/andrewmatten/foxess-ev-charger/blob/main/blueprints/automation/foxess_charger/solar_surplus_charging.yaml
  homeassistant:
    # The `trigger:`/`condition:`/`action:` (rather than the older
    # `platform:`/`service:`) automation schema keys used throughout this
    # blueprint were introduced in HA 2024.10 - a version older than this
    # would fail to load it at all, so this is a real floor, not a
    # decorative guess.
    min_version: "2024.10.0"
  input:
    grid_power_sensor:
      name: Grid Power Sensor
      description: >
        Instantaneous grid power with unit_of_measurement W or kW. Readings
        in kW are converted to Watts. Positive = importing from the grid,
        negative = exporting surplus (see "Invert grid power sign" below if
        yours is the opposite convention). Sensors with other or missing
        units or nonnumeric readings are treated as unsafe and stop charging.
      selector:
        entity:
          domain: sensor
          device_class: power
    invert_grid_power_sign:
      name: Invert grid power sign
      description: Enable if your sensor instead reports positive = exporting.
      default: false
      selector:
        boolean: {}
    max_current_number:
      name: Max Charging Current
      description: The FoxESS EV Charger's Max Charging Current number entity.
      selector:
        entity:
          integration: foxess_charger
          domain: number
    charging_switch:
      name: Charging switch
      description: >
        The FoxESS EV Charger's Charging switch. Turned off when already at
        minimum current and import stays above the ceiling, and back on
        (from minimum current) once surplus recovers with a car connected.
      selector:
        entity:
          integration: foxess_charger
          domain: switch
    vehicle_connected:
      name: Vehicle Connected / Status sensor
      description: >
        The FoxESS EV Charger's Vehicle Connected binary sensor (or Status
        sensor) used to verify a car is plugged in and ready before turning
        charging on. If omitted, the blueprint inspects the Charging
        switch's device automatically.
      default:
      selector:
        entity:
          filter:
            - integration: foxess_charger
              domain: binary_sensor
              device_class: plug
            - integration: foxess_charger
              domain: sensor
              device_class: enum
    import_ceiling_watts:
      name: Grid import ceiling
      description: >
        Target ceiling for grid import. Charging current is raised while
        import stays below this and lowered while it exceeds this (subject
        to the hysteresis band below).
      default: 200
      selector:
        number:
          min: 0
          max: 5000
          step: 50
          unit_of_measurement: W
    hysteresis_watts:
      name: Hysteresis
      description: >
        Dead band around the import ceiling. No adjustment is made while
        import is within this range of the ceiling in either direction.
      default: 150
      selector:
        number:
          min: 0
          max: 2000
          step: 25
          unit_of_measurement: W
    current_step_amps:
      name: Adjustment step
      description: How much to raise/lower Max Charging Current per adjustment.
      default: 1
      selector:
        number:
          min: 1
          max: 8
          step: 1
          unit_of_measurement: A
    min_adjustment_interval:
      name: Minimum time between adjustments
      description: >
        Floor on how often this automation may change the charger's
        setpoint.
      default:
        minutes: 2
      selector:
        duration: {}

mode: single
max_exceeded: silent

variables:
  grid_power_sensor: !input grid_power_sensor
  grid_power_unit: "{{ state_attr(grid_power_sensor, 'unit_of_measurement') }}"
  invert_grid_power_sign: !input invert_grid_power_sign
  max_current_number: !input max_current_number
  charging_switch: !input charging_switch
  vehicle_connected: !input vehicle_connected
  import_ceiling_watts: !input import_ceiling_watts
  hysteresis_watts: !input hysteresis_watts
  current_step_amps: !input current_step_amps
  min_adjustment_interval: !input min_adjustment_interval
  min_adjustment_seconds: >
    {{ (min_adjustment_interval.hours | default(0, true)) * 3600
       + (min_adjustment_interval.minutes | default(0, true)) * 60
       + (min_adjustment_interval.seconds | default(0, true))
       if min_adjustment_interval is mapping
       else (min_adjustment_interval | int(120)) }}
  intent_enabled: "{{ state_attr(charging_switch, 'intent_enabled') == true }}"
  car_connected: >
    {% set dev = device_id(charging_switch) %}
    {% set sibs = device_entities(dev) if dev else [] %}
    {% set ns = namespace(plug=none, status=none) %}
    {% for e in sibs %}
      {% if e.startswith('binary_sensor.') and state_attr(e, 'device_class') == 'plug' %}
        {% set ns.plug = e %}
      {% elif e.startswith('sensor.') and 'finished' in (state_attr(e, 'options') or []) %}
        {% set ns.status = e %}
      {% endif %}
    {% endfor %}
    {% if vehicle_connected is string and vehicle_connected %}
      {% if vehicle_connected.startswith('binary_sensor.') %}
        {% set ok = is_state(vehicle_connected, 'on') %}
      {% else %}
        {% set ok = states(vehicle_connected) in ['connected', 'start', 'charging', 'paused', 'phase_switching'] %}
      {% endif %}
    {% elif ns.plug is not none %}
      {% set ok = is_state(ns.plug, 'on') %}
    {% else %}
      {% set ok = false %}
    {% endif %}
    {% if ok and ns.status is not none
        and states(ns.status) not in ['unknown', 'unavailable'] %}
      {% set ok = states(ns.status) in ['connected', 'start', 'charging', 'paused', 'phase_switching'] %}
    {% endif %}
    {{ ok }}

trigger:
  - trigger: state
    entity_id: !input grid_power_sensor
  - trigger: time_pattern
    minutes: "/1"

action:
  - choose:
      # Fail-safe: missing/nonnumeric value or unsupported unit - stop
      # charging (and disarm any staged enable) rather than interpret an
      # unknown value as 0 W/export. Deliberately checked before the dwell
      # and number-availability gates.
      - conditions:
          - condition: template
            value_template: >
              {{ not is_number(states(grid_power_sensor)) or
                 grid_power_unit not in ['W', 'kW'] }}
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ not is_state(charging_switch, 'off') or intent_enabled }}
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input charging_switch
      # Car gone (unplugged, or the charger no longer shows it connected)
      # while an enable is still staged: disarm it now, so the next plug-in
      # (e.g. at night) never starts at the last setpoint. Before the dwell
      # gate, and independent of grid power (a house battery can hold the
      # grid near 0 W, so the over-import branch would never fire).
      - conditions:
          - condition: template
            value_template: >
              {{ intent_enabled and is_state(charging_switch, 'off')
                 and not car_connected }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input charging_switch
    default:
      # Guard an unavailable/unknown/missing Max Charging Current entity so
      # a missing state never raises on `.last_changed` or gets coerced to 6 A.
      - condition: template
        value_template: "{{ is_number(states(max_current_number)) }}"
      # Minimum dwell time between adjustments - only gates the normal
      # raise/lower path below, never the fail-safe stop above.
      - condition: template
        value_template: >
          {{ states[max_current_number] is not none and (
               states[max_current_number].last_changed is none or
               (now() - states[max_current_number].last_changed).total_seconds() >= min_adjustment_seconds
             ) and (
               states[charging_switch] is none or
               states[charging_switch].last_changed is none or
               (now() - states[charging_switch].last_changed).total_seconds() >= min_adjustment_seconds
             ) }}
      - variables:
          raw_grid_power: >
            {{ (states(grid_power_sensor) | float(0)) *
               (1000 if grid_power_unit == 'kW' else 1) }}
          import_power: "{{ (raw_grid_power * -1) if invert_grid_power_sign else raw_grid_power }}"
          current_amps: "{{ states(max_current_number) | float }}"
          entity_min: "{{ state_attr(max_current_number, 'min') | float(6) }}"
          entity_max: "{{ state_attr(max_current_number, 'max') | float(32) }}"
          switch_is_off: "{{ is_state(charging_switch, 'off') }}"
      - choose:
          # Import too high - step current down (never below entity_min)
          # while charging, and stop (or disarm a staged intent_enabled)
          # once already at min or when the switch is already off.
          - conditions:
              - "{{ import_power > (import_ceiling_watts + hysteresis_watts) }}"
            sequence:
              - choose:
                  - conditions:
                      - "{{ current_amps <= entity_min or switch_is_off }}"
                    sequence:
                      - if:
                          - "{{ not switch_is_off or intent_enabled }}"
                        then:
                          - action: switch.turn_off
                            target:
                              entity_id: !input charging_switch
                default:
                  - action: number.set_value
                    target:
                      entity_id: !input max_current_number
                    data:
                      value: "{{ [current_amps - current_step_amps, entity_min] | max }}"
          # Surplus available - raise current if already charging, or start
          # from entity_min if off and a connected car is ready to charge.
          - conditions:
              - "{{ import_power < (import_ceiling_watts - hysteresis_watts) }}"
            sequence:
              - choose:
                  - conditions:
                      - "{{ is_state(charging_switch, 'on') }}"
                    sequence:
                      - if:
                          - "{{ current_amps < entity_max }}"
                        then:
                          - action: number.set_value
                            target:
                              entity_id: !input max_current_number
                            data:
                              value: "{{ [current_amps + current_step_amps, entity_max] | min }}"
                  - conditions:
                      - "{{ switch_is_off }}"
                      - "{{ car_connected }}"
                      - "{{ not intent_enabled }}"
                      - "{{ not state_attr(charging_switch, 'needs_human') }}"
                      - "{{ not state_attr(charging_switch, 'latch_cause') }}"
                    sequence:
                      # Stage entity_min unless the controller's saved desired
                      # current already equals it: with no saved current, the
                      # number displays the hardware reading (e.g. 6 A), and
                      # skipping set_value lets turn_on write rated current.
                      - if:
                          - condition: template
                            value_template: >
                              {% set desired = state_attr(max_current_number, 'desired') %}
                              {{ desired is none or not is_number(desired)
                                 or (desired | float) != entity_min }}
                        then:
                          - action: number.set_value
                            target:
                              entity_id: !input max_current_number
                            data:
                              value: "{{ entity_min }}"
                      - action: switch.turn_on
                        continue_on_error: true
                        target:
                          entity_id: !input charging_switch
                      # A refused turn-on (for example Max Charging Power below
                      # 1.4 kW) is not retried on every grid update: this run
                      # holds for a minute (mode single drops triggers meanwhile).
                      - if:
                          - "{{ state_attr(charging_switch, 'intent_enabled') != true }}"
                        then:
                          - delay:
                              seconds: 60
        # Within the hysteresis band around the ceiling - no adjustment.
        default: []
